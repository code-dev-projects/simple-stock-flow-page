<svg class="ssf-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img"
     aria-label="Topología: el navegador solo alcanza el portal por el puerto 8080; la API y la base viven dentro de la red de Docker y solo se publican con el solapamiento de desarrollo."
     font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, sans-serif">
  <title>Topología de despliegue de Simple Stock Flow</title>
  <desc>Tres contenedores en una red de Docker. El único puerto publicado en producción es el del portal.</desc>
  <defs>
    <marker id="d01-arrow" viewBox="0 0 9 7" refX="8" refY="3.5" markerWidth="8" markerHeight="7" orient="auto-start-reverse">
      <path class="d-arrow" d="M0,0 L9,3.5 L0,7 z"/>
    </marker>
    <marker id="d01-arrow-dev" viewBox="0 0 9 7" refX="8" refY="3.5" markerWidth="8" markerHeight="7" orient="auto-start-reverse">
      <path class="d-arrow-dev" d="M0,0 L9,3.5 L0,7 z"/>
    </marker>
    <style>
      /* The page owns the theme. Each token reads the page's variable first, so a page
         served light while the system is dark still draws a light diagram; the literal
         values only apply when this file is opened outside the page. */
      .ssf-diagram {
        font-family: var(--fuente, ui-sans-serif, system-ui, 'Segoe UI', Roboto, sans-serif);
        --d-surface      : var(--superficie, #f4f6f9);
        --d-panel        : var(--superficie-alta, #ffffff);
        --d-sunken       : var(--superficie-hundida, #eef1f5);
        --d-border       : var(--borde, #dde2e9);
        --d-border-strong: var(--borde-fuerte, #c3cad4);
        --d-text         : var(--texto, #1b2430);
        --d-text-soft    : var(--texto-suave, #5b6672);
        --d-accent       : var(--acento, #4338ca);
        --d-accent-strong: var(--acento-fuerte, #3730a3);
        --d-accent-soft  : var(--acento-tenue, #eef0fc);
        --d-warn         : var(--aviso, #b45309);
      }
      @media (prefers-color-scheme: dark) {
        .ssf-diagram {
          --d-surface      : var(--superficie, #11151c);
          --d-panel        : var(--superficie-alta, #191f28);
          --d-sunken       : var(--superficie-hundida, #222a35);
          --d-border       : var(--borde, #2c3542);
          --d-border-strong: var(--borde-fuerte, #3d4757);
          --d-text         : var(--texto, #e8ecf1);
          --d-text-soft    : var(--texto-suave, #9aa5b4);
          --d-accent       : var(--acento, #7c73ee);
          --d-accent-strong: var(--acento-fuerte, #8f88f2);
          --d-accent-soft  : var(--acento-tenue, #232544);
          --d-warn         : var(--aviso, #f59e0b);
        }
      }
      .ssf-diagram .d-card { fill: var(--d-panel); stroke: var(--d-border); }
      .ssf-diagram .d-box { fill: var(--d-sunken); stroke: var(--d-border-strong); }
      .ssf-diagram .d-vol { fill: var(--d-surface); stroke: var(--d-border-strong); }
      .ssf-diagram .d-zone { stroke: var(--d-border-strong); }
      .ssf-diagram .d-focus { fill: var(--d-accent-soft); stroke: var(--d-accent); }
      .ssf-diagram .d-title { fill: var(--d-text); }
      .ssf-diagram .d-label { fill: var(--d-text); }
      .ssf-diagram .d-sub { fill: var(--d-text-soft); }
      .ssf-diagram .d-edge { stroke: var(--d-text-soft); }
      .ssf-diagram .d-arrow { fill: var(--d-text-soft); }
      .ssf-diagram .d-dev { stroke: var(--d-warn); }
      .ssf-diagram .d-warn-text { fill: var(--d-warn); }
      .ssf-diagram .d-arrow-dev { fill: var(--d-warn); }
    </style>
  </defs>

  <rect class="d-card" x="0.5" y="0.5" width="999" height="559" rx="12"/>

  <rect class="d-zone" x="200" y="32" width="776" height="450" rx="14" fill="none" stroke-dasharray="6 5"/>
  <text class="d-sub" x="216" y="54" font-size="11">red docker · simple-stock-flow</text>

  <rect class="d-box" x="24" y="100" width="120" height="92" rx="8"/>
  <text class="d-title" x="84" y="140" text-anchor="middle" font-size="13" font-weight="600">Navegador</text>
  <text class="d-sub" x="84" y="160" text-anchor="middle" font-size="10">localhost:8080</text>

  <rect class="d-box" x="250" y="100" width="166" height="92" rx="8"/>
  <text class="d-title" x="333" y="128" text-anchor="middle" font-size="13" font-weight="600">portal</text>
  <text class="d-sub" x="333" y="149" text-anchor="middle" font-size="10">nginx 1.27-alpine</text>
  <text class="d-sub" x="333" y="166" text-anchor="middle" font-size="10">el build de Angular</text>
  <text class="d-sub" x="333" y="181" text-anchor="middle" font-size="10">y el proxy</text>

  <rect class="d-focus" x="506" y="100" width="190" height="92" rx="8"/>
  <text class="d-title" x="601" y="128" text-anchor="middle" font-size="13" font-weight="600">service</text>
  <text class="d-sub" x="601" y="149" text-anchor="middle" font-size="10">.NET 8 · Kestrel :8080</text>
  <text class="d-sub" x="601" y="166" text-anchor="middle" font-size="10">crea el esquema</text>
  <text class="d-sub" x="601" y="181" text-anchor="middle" font-size="10">al arrancar</text>

  <rect class="d-box" x="786" y="100" width="154" height="92" rx="8"/>
  <text class="d-title" x="863" y="128" text-anchor="middle" font-size="13" font-weight="600">db</text>
  <text class="d-sub" x="863" y="149" text-anchor="middle" font-size="10">postgres:16-alpine</text>
  <text class="d-sub" x="863" y="166" text-anchor="middle" font-size="10">5432, sin salir</text>
  <text class="d-sub" x="863" y="181" text-anchor="middle" font-size="10">de la red</text>

  <line class="d-edge" x1="148" y1="146" x2="242" y2="146" stroke-width="1.5" marker-end="url(#d01-arrow)"/>
  <text class="d-label" x="195" y="128" text-anchor="middle" font-size="10">HTTP · :8080 → 80</text>
  <text class="d-label" x="195" y="141" text-anchor="middle" font-size="10">el único publicado</text>

  <line class="d-edge" x1="420" y1="146" x2="498" y2="146" stroke-width="1.5" marker-end="url(#d01-arrow)"/>
  <text class="d-label" x="459" y="128" text-anchor="middle" font-size="10">proxy /api</text>
  <text class="d-label" x="459" y="141" text-anchor="middle" font-size="10">/media · /swagger</text>

  <line class="d-edge" x1="700" y1="146" x2="778" y2="146" stroke-width="1.5" marker-end="url(#d01-arrow)"/>
  <text class="d-label" x="739" y="128" text-anchor="middle" font-size="10">EF Core · Npgsql</text>
  <text class="d-label" x="739" y="141" text-anchor="middle" font-size="10">TCP 5432</text>

  <path class="d-vol" d="M486,340 v56 a70,10 0 0 0 140,0 v-56"/>
  <ellipse class="d-vol" cx="556" cy="340" rx="70" ry="10"/>
  <text class="d-title" x="556" y="370" text-anchor="middle" font-size="12" font-weight="600">volumen media</text>
  <text class="d-sub" x="556" y="387" text-anchor="middle" font-size="10">binarios subidos</text>

  <path class="d-vol" d="M793,340 v56 a70,10 0 0 0 140,0 v-56"/>
  <ellipse class="d-vol" cx="863" cy="340" rx="70" ry="10"/>
  <text class="d-title" x="863" y="370" text-anchor="middle" font-size="12" font-weight="600">volumen pgdata</text>
  <text class="d-sub" x="863" y="387" text-anchor="middle" font-size="10">datos del motor</text>

  <line class="d-edge" x1="556" y1="196" x2="556" y2="326" stroke-width="1.5" marker-end="url(#d01-arrow)"/>
  <text class="d-label" x="566" y="252" font-size="10">escribe y lee</text>
  <text class="d-label" x="566" y="265" font-size="10">los binarios</text>

  <line class="d-edge" x1="863" y1="196" x2="863" y2="326" stroke-width="1.5" marker-end="url(#d01-arrow)"/>
  <text class="d-label" x="873" y="258" font-size="10">datos</text>

  <rect class="d-box" x="24" y="408" width="150" height="70" rx="8"/>
  <text class="d-title" x="99" y="428" text-anchor="middle" font-size="12" font-weight="600">verify.sh · seed.py</text>
  <text class="d-sub" x="99" y="444" text-anchor="middle" font-size="9">de simple-stock-flow-infra</text>
  <text class="d-sub" x="99" y="457" text-anchor="middle" font-size="9">y de simple-stock-flow-tools,</text>
  <text class="d-sub" x="99" y="470" text-anchor="middle" font-size="9">desde el anfitrión</text>

  <polyline class="d-edge d-dev" points="178,443 676,443 676,196" fill="none" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#d01-arrow-dev)"/>
  <text class="d-warn-text" x="420" y="421" text-anchor="middle" font-size="10">:5000 → 8080 · y :5432 para la base</text>
  <text class="d-warn-text" x="420" y="434" text-anchor="middle" font-size="10">solo con docker-compose.dev.yml</text>

  <line class="d-edge" x1="232" y1="509" x2="272" y2="509" stroke-width="1.5"/>
  <text class="d-sub" x="280" y="513" font-size="10.5">tráfico que existe siempre</text>
  <line class="d-edge d-dev" x1="520" y1="509" x2="560" y2="509" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text class="d-sub" x="568" y="513" font-size="10.5">solo con el solapamiento de desarrollo</text>
</svg>
